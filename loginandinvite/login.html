<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Bloom · Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>

<body>
  <main class="phone">
    <!-- Flower decorations (absolutely positioned) -->
    <span class="deco deco-1" aria-hidden="true"></span>
    <span class="deco deco-2" aria-hidden="true"></span>
    <span class="deco deco-3" aria-hidden="true"></span>
    <span class="deco deco-4" aria-hidden="true"></span>

    <!-- BLOOM logo -->
    <div class="logo">
      <img src="../logo.png" alt="BLOOM" />
    </div>

    <div class="tagline">🌱 <b>Plant Joy Together</b> ✨</div>

    <!-- Editable avatar -->
    <div class="avatar-wrap">
      <label class="avatar" for="avatarInput" title="Click to change photo">
        <img id="avatarImg" alt="Profile avatar" src="../profile.png" />
        <div class="avatar-edit" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z" />
          </svg>
        </div>
      </label>
      <input type="file" id="avatarInput" accept="image/*" hidden />
    </div>

    <h2 class="welcome">Welcome back to your Garden</h2>
    <p class="subtitle">Another day of growing together 🌸</p>

    <!-- Form -->
    <form class="form" id="loginForm" novalidate>
      <div class="field" id="fieldUser">
        <span class="field-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3c1 2 3 3 3 6a3 3 0 11-6 0c0-3 2-4 3-6z" />
            <path d="M6 14h12l-1 6H7l-1-6z" />
          </svg>
        </span>
        <input type="text" id="username" name="username" placeholder="Phone number / Username" autocomplete="username"
          inputmode="tel" />
      </div>

      <div class="field" id="fieldPw">
        <span class="field-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="11" rx="2.5" />
            <path d="M8 10V7a4 4 0 118 0v3" />
          </svg>
        </span>
        <input type="password" id="password" name="password" placeholder="Garden Password"
          autocomplete="current-password" />
        <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
          <svg id="eyeOpen" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <svg id="eyeOff" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M17.94 17.94A10.4 10.4 0 0112 20C5 20 1 12 1 12a20 20 0 015.06-5.94" />
            <path d="M9.9 4.24A9.6 9.6 0 0112 4c7 0 11 8 11 8a20 20 0 01-3.16 4.19" />
            <path d="M14.12 14.12a3 3 0 11-4.24-4.24" />
            <line x1="1" y1="1" x2="23" y2="23" />
          </svg>
        </button>
      </div>

      <div class="row-links">
        <button type="button" class="link sms" id="smsBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />
          </svg>
          <span>SMS Quick Sign In</span>
        </button>
        <button type="button" class="link forgot" id="forgotBtn">Forgot password?</button>
      </div>

      <button type="submit" class="cta" id="signInBtn">Start Today's Care (Sign In)</button>
    </form>

    <!-- Divider + friend buttons -->
    <div class="friends">
      <div class="divider"><span>QUICK SIGN IN WITH FRIENDS</span></div>
      <div class="friend-buttons">
        <button class="fb" data-provider="chat" aria-label="Sign in with chat">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />
          </svg>
        </button>
        <button class="fb" data-provider="box" aria-label="Sign in with box">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l9 5v10l-9 5-9-5V7z" />
            <path d="M3 7l9 5 9-5" />
            <path d="M12 12v10" />
          </svg>
        </button>
        <button class="fb" data-provider="add-friend" aria-label="Add a friend">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <line x1="19" y1="8" x2="19" y2="14" />
            <line x1="22" y1="11" x2="16" y2="11" />
          </svg>
        </button>
      </div>
    </div>

    <p class="create">
      Don't have account ?
      <a href="create-account.html" id="createLink">Create account &rarr;</a>
    </p>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="bloom-api.js"></script>
  <script src="login.js"></script>
</body>

</html>
