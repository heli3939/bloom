<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Bloom · Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="create-account.css" />
</head>
<body>
  <main class="phone">
    <!-- BLOOM logo -->
    <div class="logo">
      <img src="/Logo.png" alt="BLOOM" />
    </div>

    <div class="tagline">🌱 <b>Plant Joy Together</b> ✨</div>

    <!-- Editable avatar -->
    <div class="avatar-wrap">
      <label class="avatar" for="avatarInput" title="Click to change photo">
        <img id="avatarImg" alt="Profile avatar" src="/profile.png" />
        <div class="avatar-edit" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z" />
          </svg>
        </div>
      </label>
      <input type="file" id="avatarInput" accept="image/*" hidden />
    </div>

    <h2 class="welcome">Welcome and join BLOOM</h2>
    <p class="subtitle">Another day of growing together</p>

    <form id="signupForm" novalidate>
      <div class="signup-card">
        <!-- Nickname -->
        <div class="row">
          <label class="row-label" for="nickname">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <circle cx="9" cy="10" r="0.9" fill="currentColor" />
              <circle cx="15" cy="10" r="0.9" fill="currentColor" />
              <path d="M9 15q3 2 6 0" />
            </svg>
            Your Nickname (Gardener Name)
          </label>
          <div class="row-input pink" id="rowNickname">
            <input type="text" id="nickname" name="nickname"
                   placeholder="e.g., Matcha Puff / Sprout Caretaker" autocomplete="nickname" />
            <button type="button" class="row-icon-btn" aria-label="Edit nickname"
                    onclick="document.getElementById('nickname').focus()">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Phone / Email -->
        <div class="row">
          <label class="row-label" for="contact">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="M3 7l9 6 9-6" />
            </svg>
            Phone Number / Email
          </label>
          <div class="row-input pink" id="rowContact">
            <input type="text" id="contact" name="contact"
                   placeholder="Enter phone number or email" autocomplete="email" />
            <button type="button" class="row-icon-btn" id="sendCodeBtn" aria-label="Send verification code">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="3" width="12" height="18" rx="2.5" />
                <path d="M9 8l4 4-4 4" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Password -->
        <div class="row">
          <label class="row-label" for="password">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="10" width="16" height="11" rx="2.5" />
              <path d="M8 10V7a4 4 0 118 0v3" />
            </svg>
            Secret Password
          </label>
          <div class="row-input pink" id="rowPassword">
            <input type="password" id="password" name="password"
                   placeholder="At least 8 cute characters" autocomplete="new-password" />
            <button type="button" class="row-icon-btn" id="togglePw" aria-label="Show password">
              <svg id="eyeOpen" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg id="eyeOff" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.4 10.4 0 0112 20C5 20 1 12 1 12a20 20 0 015.06-5.94" />
                <path d="M9.9 4.24A9.6 9.6 0 0112 4c7 0 11 8 11 8a20 20 0 01-3.16 4.19" />
                <path d="M14.12 14.12a3 3 0 11-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Invite code (optional, green) -->
        <div class="row">
          <label class="row-label" for="invite">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 12l-8 8-9-9V3h8l9 9z" />
              <circle cx="7.5" cy="7.5" r="1.2" fill="currentColor" />
            </svg>
            Friend Invite Code (Optional)
          </label>
          <div class="row-input green" id="rowInvite">
            <input type="text" id="invite" name="invite" placeholder="" autocomplete="off" />
            <button type="button" class="paste-btn" id="pasteBtn">Paste</button>
          </div>
        </div>

        <!-- Terms -->
        <label class="agree">
          <input type="checkbox" id="agree" checked />
          <span class="check-visual" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                 stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </span>
          <span class="agree-text">
            I have read and agree to the <b>Garden Community Guidelines</b> &amp; Privacy Policy
          </span>
        </label>
      </div>

      <button type="submit" class="cta" id="signUpBtn">Sign Up</button>
    </form>

    <p class="create">
      Already have a garden account?
      <a href="login.html" id="signInLink">Sign In &rarr;</a>
    </p>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="bloom-api.js"></script>
  <script src="create-account.js"></script>
</body>
</html>
